<!-- Flippable card -->
<ng-container *ngIf="flippable">

    <!-- Front -->
    <div class="eaii-card-front">
        <ng-content select="[eaiiCardFront]"></ng-content>
    </div>

    <!-- Back -->
    <div class="eaii-card-back">
        <ng-content select="[eaiiCardBack]"></ng-content>
    </div>

</ng-container>

<!-- Normal card -->
<ng-container *ngIf="!flippable">

    <!-- Content -->
    <ng-content></ng-content>

    <!-- Expansion -->
    <div
        class="eaii-card-expansion"
        *ngIf="expanded"
        [@expandCollapse]>
        <ng-content select="[eaiiCardExpansion]"></ng-content>
    </div>

</ng-container>
