<div class="relative flex flex-col w-full h-full">

    <!-- Content -->
    <div class="flex flex-col sm:flex-row flex-auto items-center sm:items-start ">
        <ng-container>
            <div
                class="flex flex-col items-center sm:items-start mt-2 sm:mt-0  space-y-1 text-center sm:text-left">

                <!-- Title -->
                <ng-container>
                    <div
                        class="text-xl leading-6 font-medium border-b-2 w-full  justify-center text-center items-center  primary-border">
                        Patient Information
                    </div>
                </ng-container>


                <!-- Message -->
                <ng-container>

                    <div class="w-full  justify-center text-center items-center">
                        <p *ngIf="!revisit" class=" mt-8 font-medium text-success ">Successfully Saved!</p>

                        <div class="mt-8 w-full  justify-center text-center items-center">
                            <p class="font-bold">{{testResult.valueOf()}}</p>
                        </div>

                    </div>
                </ng-container>

                <div class=" w-full  flex justify-center">

                    <!-- Submit button -->
                    <button (click)="onDetermineType()" *ngIf="testResult.valueOf() === testResultEnum.DETECTED"
                            [color]="'warn'" class="fuse-mat-button-small mt-6 pl-8 pr-8" mat-stroked-button
                            type="button">
                    <span>
                        Determine Type and Complication
                    </span>
                    </button>

                    <!-- Submit button -->
                    <button (click)="onCalculateRisk()" *ngIf="testResult.valueOf() === testResultEnum.NOT_DETECTED"
                            [color]="'warn'" class="fuse-mat-button-small mt-6 pl-8 pr-8" mat-stroked-button
                            type="button">
                    <span>
                        Calculate Risk
                    </span>
                    </button>

                    <button (click)="onClose()" *ngIf="testResult.valueOf() === testResultEnum.PRE" [color]="'warn'"
                            class="fuse-mat-button-small mt-6 pl-8 pr-8" mat-stroked-button
                            type="button">
                    <span>
                        Close
                    </span>
                    </button>

                </div>

            </div>
        </ng-container>

    </div>

</div>

<!-- [matDialogClose]="'confirmed'" -->
