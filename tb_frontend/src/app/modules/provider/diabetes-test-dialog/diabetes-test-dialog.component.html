<div class="relative flex flex-col w-full h-full">

    <!-- Content -->
    <div class="flex flex-col sm:flex-row flex-auto items-center sm:items-start  pb-6 sm:pb-8">
        <ng-container>
            <div
                class="flex flex-col items-center sm:items-start mt-2 sm:mt-0 sm:pr-8 space-y-1 text-center sm:text-left">

                <!-- Title -->
                <ng-container>
                    <div
                        class="text-xl leading-6 font-medium border-b-2 w-full  justify-center text-center items-center  primary-border">
                        Diabetes Mellitus Prediction
                    </div>
                </ng-container>


                <!-- Message -->
                <ng-container>
                    <div class="w-full  justify-center text-center items-center">
                        <p class=" mt-4 font-medium text-primary ">FBS or HbA1c test</p>
                        <form  (ngSubmit)="onDiagnosis()" [formGroup]="sugarForm"
                            class="flex flex-col  mt-0 bg-card w-full justify-center text-center  ">

                            <div class="mt-8  justify-center text-center ">
                                <mat-form-field appearance="legacy" class="example-full-width">
                                    <input [placeholder]="'Fast Blood Sugar'" class="toolbar-search"
                                        formControlName="fbs" matInput type="text">
                                </mat-form-field>
                            </div>
                            <div class="justify-center text-center ">
                                <mat-form-field appearance="legacy" class="example-full-width">
                                    <input [placeholder]="'Hemoglobin A1c'" class="toolbar-search" formControlName="hb1"
                                        matInput type="text">
                                </mat-form-field>
                            </div>

                            <!-- Actions -->
                            <ng-container>
                                <div class="flex justify-center gap-6 mt-2 ">

                                    <!-- Cancel -->
                                    <ng-container>
                                        <a [matDialogClose]="'cancelled'" class="text-red font-bold btn-anchor">
                                            Cancel
                                        </a>
                                    </ng-container>

                                    <!-- Confirm -->
                                    <ng-container>
                                        <a (click)="onDiagnosis()" type="submit" class="text-primary font-bold btn-anchor">
                                            Diagnosis
                                        </a>
                                    </ng-container>

                                </div>
                            </ng-container>

                        </form>


                    </div>
                </ng-container>

            </div>
        </ng-container>

    </div>



</div>

<!-- [matDialogClose]="'confirmed'" -->
