<!-- Loading bar -->
<eaii-loading-bar></eaii-loading-bar>

<!-- Navigation -->
<eaii-vertical-navigation
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="!isScreenSmall"
    class="bg-card print:hidden nav-border border-r">
    <!-- Navigation header hook -->
    <ng-container eaiiVerticalNavigationContentHeader>
        <!-- Logo -->
        <div class="relative mb-4  hidden md:flex flex-auto items-center
         justify-center mt-4  overflow-hidden">
            <!-- Light version -->
            <img
                alt="Logo image"
                class="justify-center dark:hidden h-20 w-20 "
                src="assets/images/logo.png">
            <!-- Dark version -->
            <img
                alt="Logo image"
                class="hidden dark:flex "
                src="assets/images/logo.png">
        </div>
    </ng-container>
</eaii-vertical-navigation>

<!-- Wrapper -->
<div class="w-full h-screen flex flex-auto flex-col">

    <!-- Header -->
    <div
        class="relative flex flex-0 items-center w-full h-16 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden">
        <!-- Navigation toggle button -->
        <button
            (click)="toggleNavigation('mainNavigation')"
            mat-icon-button>
            <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
        </button>
        <strong class="logo-prim mr-1 ml-4">Tuberculosis</strong><strong class="logo-prim"> Detection</strong>
        <!-- Components -->
        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <eaii-fullscreen class="hidden md:block"></eaii-fullscreen>
            <search [appearance]="'bar'"></search>
            <user></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex mb-0 flex-auto  overflow-scroll ">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        <router-outlet *ngIf="true"></router-outlet>
    </div>

    <!-- Footer -->
    <div
        class="relative flex mt-0 flex-0 items-center justify-start w-full h-14 px-4 md:px-6 z-49 border-t bg-card ">
        <span class="font-medium text-secondary text-muted">Ethiopian Artificial Intelligence Institute (EAII) &copy; {{currentYear}}</span>
    </div>

</div>
